# SPDX-License-Identifier: AGPL-3.0-or-later
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # {{version}} / {{digest:*}} の埋め方は sukhi-setup の bin/sukhi-render が唯一の場所
      - uses: actions/checkout@v4
        with: { repository: sukhi-social/sukhi-setup, path: .setup }
      - run: SUKHI_SETUP=.setup ruby scripts/check.rb
  signatures:
    # PR が指すダイジェストすべてに cosign verify(身元は sukhi-fedi の release.yml / combined-sha.yml)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: sukhi-social/sukhi-setup, path: .setup }
      - uses: sigstore/cosign-installer@v3.7.0
      - run: SUKHI_SETUP=.setup SUKHI_COSIGN=1 ruby scripts/check.rb
  quadlet-dryrun:
    # base + overlay を重ねて、Quadlet が unit を生成できるか。
    # 注意: runner の Podman(4.9)は箱の版と違い、Notify=healthy などを知らないかもしれない。
    # 箱の版が決まる(OPS_QUADLET_GITOPS.md §12-6)まで、結果は参考(落ちても PR は止めない)。
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: sukhi-social/sukhi-setup, path: .setup }
      - run: |
          set -eu
          out="$RUNNER_TEMP/quadlet-${{ matrix.env }}"
          mkdir -p "$out"
          cp -a base/. "$out/"
          cp -a overlays/${{ matrix.env }}/. "$out/"
          ruby .setup/bin/sukhi-render overlays/${{ matrix.env }}/sukhi.version "$out"
          rm -f "$out/sukhi.version"
          q=$(command -v quadlet || ls /usr/libexec/podman/quadlet /usr/lib/podman/quadlet 2>/dev/null | head -1)
          echo "quadlet: $q"; podman --version
          QUADLET_UNIT_DIRS="$out" "$q" -dryrun -user
