# prod の差分(sukhi.social の現行値)。キーは後勝ち、Environment= は足される。
[Container]
# 箱の bind。uid は箱で動いていた形(image の node は uid 1000)。
UserNS=keep-id:uid=1000,gid=1000
User=1000:1000
Volume=/home/sukhi/sukhi-social-web/data:/app/data:Z
Environment=PUBLIC_ORIGIN=https://sukhi.social
Environment=SITE_NAME=sukhi.social
Environment=SITE_LOGO=https://about.sukhi.social/logo.svg
PodmanArgs=--memory=192m --cpus=0.3
